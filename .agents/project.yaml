version: 1
project:
  name: replace-me
  objective: replace-me
  status: discovery

stack:
  backend: FastAPI
  frontend: React + Vite + TypeScript
  database: PostgreSQL
  migrations: Alembic
  infrastructure: Docker Compose
  package_manager: unknown

commands:
  install: ""
  create_venv: "python3 -m venv .venv"
  test_backend: ""
  test_frontend: ""
  lint: ""
  build: ""
  migrate: ""
  run: ""
  deploy: "bash deploy/deploy.sh"

modules:
  auth:
    provider: none
    frontend_flow: standard-password
  migrations:
    strategy: resilient-alembic
    outcomes: [APPLIED, SKIPPED_EQUAL, CONFLICT]
  docker:
    convention: compose-project-services
  observability:
    structured_logs: optional
    request_id: X-Request-ID
  audit:
    durable_events: optional
  deployment:
    contract: optional
    mode: manual-vps

boundaries:
  protected_paths:
    - .env
    - .venv/
    - deploy/deploy.env
    - secrets/
  generated_paths: []
  do_not_change_without_request:
    - authentication
    - database schema
    - deployment configuration

quality_gates:
  require_tests_for_logic_changes: true
  require_migration_for_schema_changes: true
  require_env_example_for_new_variables: true
  require_documented_unverified_items: true
  fail_on_schema_conflict: true
  require_healthcheck_after_deploy: true
  require_structured_logs: true
